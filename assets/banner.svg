<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="김민규 · AI를 팀으로 두고, 게임 전체를 디렉팅합니다.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141b3a"/>
      <stop offset="1" stop-color="#2a1748"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif; }
      .name { font-size: 54px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
      .en { font-size: 22px; font-weight: 500; fill: #a5b4fc; }
      .tag { font-size: 28px; font-weight: 600; fill: #e5e7eb; }
      .sub { font-size: 16px; font-weight: 500; fill: #94a3b8; letter-spacing: 0.5px; }
      .in1 { animation: up .8s ease-out .1s both; }
      .in2 { animation: up .8s ease-out .45s both; }
      .in3 { animation: up .8s ease-out .8s both; }
      @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- 게임패드와 노드: 디렉터(가운데)와 에이전트들 -->
  <g transform="translate(940 150)"><g class="float" fill="none" stroke-linecap="round">
    <g stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="2">
      <line x1="0" y1="0" x2="-110" y2="-70"/>
      <line x1="0" y1="0" x2="120" y2="-60"/>
      <line x1="0" y1="0" x2="-100" y2="80"/>
      <line x1="0" y1="0" x2="125" y2="75"/>
    </g>
    <g fill="#c4b5fd" fill-opacity="0.9">
      <circle cx="-110" cy="-70" r="7"/>
      <circle cx="120" cy="-60" r="7"/>
      <circle cx="-100" cy="80" r="7"/>
      <circle cx="125" cy="75" r="7"/>
    </g>
    <rect x="-58" y="-34" width="116" height="68" rx="30" fill="#1e1b4b" stroke="#a5b4fc" stroke-width="2.5"/>
    <g stroke="#e0e7ff" stroke-width="4">
      <line x1="-30" y1="0" x2="-14" y2="0"/>
      <line x1="-22" y1="-8" x2="-22" y2="8"/>
    </g>
    <circle cx="20" cy="-6" r="5" fill="#f472b6"/>
    <circle cx="34" cy="6" r="5" fill="#60a5fa"/>
  </g></g>

  <g class="t">
    <g class="in1">
      <text x="64" y="112" class="name">김민규</text>
      <text x="252" y="112" class="en">Minkyu Kim · Game Developer</text>
    </g>
    <g class="in2">
      <text x="64" y="172" class="tag">AI를 팀으로 두고, 게임 전체를 디렉팅합니다.<tspan class="blink" fill="#a5b4fc">▍</tspan></text>
    </g>
    <g class="in3">
      <text x="64" y="226" class="sub">SLOTS 14+ · UNITY · TYPESCRIPT · THREE.JS · AGENTIC WORKFLOWS</text>
    </g>
  </g>
</svg>
